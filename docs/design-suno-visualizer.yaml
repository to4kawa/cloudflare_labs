# design-suno-visualizer.yaml
# AI-readable strict design document for Suno Visualizer on Cloudflare Workers
# Version: 0.2.0
# Status: Draft
# Last Updated: 2026-08-01

meta:
  project: cloudflare_labs
  feature: suno-visualizer
  owner: to4kawa
  goal: |
    Allow users to paste a public Suno song URL and get a real-time client-side
    music visualization. Worker only resolves metadata and media URLs.
    Visualization is performed entirely in the browser.

constraints:
  - NO local Node.js development environment
  - NO package.json
  - NO npm install / npm run dev
  - NO wrangler as a project dependency
  - Worker source is a single index.ts (or index.js) at repository root
  - Client is pure static files under public/
  - Deployment is Git push → Cloudflare automatic deploy only
  - Do not introduce build tools, bundlers, or framework scaffolding

architecture:
  style: "edge-resolve + client-render"
  components:
    - name: Worker
      responsibility:
        - Parse Suno URL
        - Extract song ID
        - Resolve audio_url and cover_url
        - Return structured JSON metadata
      technology: Cloudflare Workers
      entry: index.ts (repository root)
      runtime: V8 isolate

    - name: Client
      responsibility:
        - Accept Suno URL from user
        - Call Worker API
        - Load audio and cover
        - Perform real-time visualization using Web Audio API + p5.js
      technology: Static HTML + vanilla JS + p5.js (CDN)
      location: public/visualizer.html

data_flow:
  - step: 1
    actor: Client
    action: User pastes Suno URL (e.g. https://suno.com/song/{uuid} or https://suno.com/s/{shortId})
  - step: 2
    actor: Client
    action: GET /api/suno?url={encoded_suno_url}
  - step: 3
    actor: Worker
    action: |
      1. Validate and parse URL
      2. Extract song ID (prefer full UUID)
      3. Resolve media URLs (prefer direct CDN construction, fallback to page fetch if needed)
      4. Optionally fetch title / duration / other metadata
      5. Return JSON
  - step: 4
    actor: Client
    action: Receive JSON → set <audio> src and cover image → start Web Audio analysis + p5.js draw loop

api:
  endpoint: /api/suno
  method: GET
  query_params:
    - name: url
      type: string
      required: true
      description: Full or short Suno song URL
  response:
    success:
      status: 200
      content_type: application/json
      schema:
        id: string
        title: string | null
        audio_url: string
        cover_url: string | null
        duration: number | null
        source_url: string
        resolved_at: string
    error:
      status: 400 | 404 | 502
      schema:
        error: string
        message: string
        code: string

url_parsing_rules:
  supported_patterns:
    - "https://suno.com/song/{uuid}"
    - "https://suno.com/s/{shortId}"
    - "https://suno.com/song/{uuid}?..."
    - bare "suno.com/song/..." and "suno.com/s/..."
  extraction_priority:
    - Prefer full UUID when available
    - Short ID should be resolved to full UUID if possible
  validation:
    - Must contain suno.com domain
    - Must match one of the supported path patterns
    - Reject non-public or malformed URLs early

media_resolution_strategy:
  primary:
    method: direct_cdn_construction
    audio: "https://cdn1.suno.ai/{id}.mp3"
    cover_candidates:
      - "https://cdn2.suno.ai/image_{id}.jpeg"
      - "https://cdn2.suno.ai/image_large_{id}.jpeg"
      - "https://cdn1.suno.ai/image_{id}.png"
  fallback:
    method: page_fetch_or_external_resolver
    notes: |
      If direct CDN returns 403/404, attempt to fetch the Suno page
      or call a trusted public resolver.
      Prefer not to depend on external services long-term.
  constraints:
    - Never store the audio file on Worker
    - Never proxy the full audio stream by default
    - Only return URLs; client loads media directly

client_requirements:
  libraries:
    - p5.js (CDN only)
    - Native Web Audio API
  features_v1:
    - URL input form
    - Cover image preview
    - Play / pause control
    - Basic FFT-based visualizer (bars or particles)
    - Responsive canvas
  non_goals_v1:
    - MP4 export / recording
    - Custom visualizer selection
    - Playlist support
    - Authentication
    - Any build step or bundler

error_handling:
  worker:
    - Invalid URL → 400
    - Song not found / private → 404
    - Upstream failure → 502
  client:
    - Show clear error message
    - Do not start visualizer if audio_url is missing

security_and_limits:
  - Rate limit the /api/suno endpoint if possible via Cloudflare
  - Do not accept arbitrary external URLs (only suno.com)
  - Do not download or cache audio on Worker
  - Respect Suno ToS; experimental use of public tracks only

implementation_plan:
  phase_1:
    - Implement /api/suno in index.ts
    - URL parser + direct CDN resolution
    - Basic success / error JSON responses
  phase_2:
    - public/visualizer.html with p5.js visualizer
    - Wire Client → Worker → Visualizer
  phase_3:
    - Improve metadata extraction
    - Better visualizer aesthetics
    - Optional recording (MediaRecorder)

verification:
  required: true
  method: deployed-static-check
  policy: |
    Code existence is not completion.
    Completion requires successful static confirmation on the deployed Cloudflare URL.
    Local Node / wrangler dev is forbidden and must not be introduced.
  steps:
    - Commit and push only the necessary files (index.ts, public/*, docs/*, wrangler.jsonc, .gitignore)
    - Let Cloudflare auto-deploy from GitHub
    - Call the deployed endpoint:
        GET https://{worker}.workers.dev/api/suno?url={public_suno_song_url}
    - Confirm HTTP 200 and valid JSON containing audio_url (and ideally cover_url)
    - Open https://{worker}.workers.dev/visualizer.html
    - Paste the same Suno URL and confirm the visualizer starts and reacts to the audio
  pass_criteria:
    - /api/suno returns the defined success schema
    - audio_url is directly playable
    - visualizer.html renders real-time visualization driven by the audio
    - No package.json, node_modules, or local build tooling exists in the repository

out_of_scope:
  - Server-side MP4 generation (FFmpeg / ffmpeg.wasm)
  - Private / non-public Suno tracks
  - High-volume production usage
  - Official Suno API key integration
  - Local development server / npm-based workflow

success_criteria:
  - Paste a public Suno URL → receive valid audio_url and cover_url from the deployed Worker
  - Client can play the track and show a working real-time visualizer on the deployed URL
  - Repository remains free of Node project scaffolding
  - Design remains simple enough for future AI agents to extend without adding build tools
